<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Studio Master Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Mukta+Mahee:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-panel: #1a1d26;
      --bg-input: #12141c;
      --border: #2a3040;
      --accent-red: #d50000;
      --accent-yellow: #ffd000;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-panel);
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .brand { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    .brand i { color: var(--accent-red); }
    .btn {
      background: #2b3245;
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: #3b445c; }
    .btn-red { background: var(--accent-red); border: none; }
    .btn-red:hover { background: #b30000; }
    .btn-yellow { background: var(--accent-yellow); color: #000; border: none; font-weight: 800; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-yellow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Mukta Mahee', 'Inter', sans-serif;
    }
    textarea { resize: vertical; min-height: 90px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-yellow); }
    .slider-box { display: flex; align-items: center; gap: 10px; }
    .slider-box input { flex: 1; accent-color: var(--accent-yellow); }
    .slider-val { font-weight: 800; color: var(--accent-yellow); width: 45px; }
    .full-width { grid-column: 1 / -1; }
    .status-toast {
      display: none;
      background: #10b981;
      color: #fff;
      padding: 6px 15px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <i class="fa-solid fa-tower-broadcast"></i>
      <span>BROADCAST CONTROL ROOM</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="status-toast" id="toast-msg"><i class="fa-solid fa-check"></i> LIVE UPDATED!</span>
      <button class="btn btn-yellow" onclick="window.open('index.html', '_blank')">
        <i class="fa-solid fa-external-link"></i> Open OBS View
      </button>
      <button class="btn btn-red" onclick="pushUpdates()">
        <i class="fa-solid fa-paper-plane"></i> PUSH LIVE
      </button>
    </div>
  </div>

  <div class="grid">

    <!-- 1. TOP BAND CONTROLS (BULK COPY-PASTE) -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-heading"></i> 1. Top Band Lines (UDT Flip)</span>
        <label style="cursor:pointer;"><input type="checkbox" id="top-enable" checked onchange="sync()"> Enable</label>
      </div>
      <div class="form-group">
        <label>Badge Title:</label>
        <input type="text" id="top-badge" value="ਖ਼ਾਸ ਖ਼ਬਰਾਂ" oninput="sync()">
      </div>
      <div class="form-group">
        <label>Font Size (19px - 72px):</label>
        <div class="slider-box">
          <input type="range" id="top-font" min="19" max="72" value="36" oninput="updateLbl('top-font-lbl', this.value); sync();">
          <span class="slider-val" id="top-font-lbl">36px</span>
        </div>
      </div>
      <div class="form-group">
        <label>Paste Headlines (1 line per headline):</label>
        <textarea id="top-bulk-lines" placeholder="Paste your multiple lines here..." oninput="sync()">ਵੱਡੀ ਖ਼ਬਰ: ਅੱਜ ਦੀਆਂ ਮੁੱਖ ਗਤੀਵਿਧੀਆਂ 'ਤੇ ਵਿਸ਼ੇਸ਼ ਰਿਪੋਰਟ
ਪ੍ਰਸ਼ਾਸਨ ਵੱਲੋਂ ਨਵੀਂ ਰਣਨੀਤੀ ਤਿਆਰ, ਸੁਰੱਖਿਆ ਪ੍ਰਬੰਧ ਸਖ਼ਤ
ਵੱਖ-ਵੱਖ ਜ਼ਿਲ੍ਹਿਆਂ ਤੋਂ ਤਾਜ਼ਾ ਅੰਕੜੇ ਅਤੇ ਰਿਪੋਰਟਾਂ ਸਾਹਮਣੇ ਆਈਆਂ
ਵਿਸ਼ੇਸ਼ ਲਾਈਵ ਚਰਚਾ: ਮਾਹਿਰਾਂ ਦੀ ਟੀਮ ਸਾਡੇ ਨਾਲ ਜੁੜ ਚੁੱਕੀ ਹੈ</textarea>
      </div>
      <div class="form-group">
        <label>UDT Flip Speed (Seconds):</label>
        <input type="number" id="top-speed" value="7" min="3" max="30" onchange="sync()">
      </div>
    </div>

    <!-- 2. FULL SCREEN GRAPHIC BREAKING PLATE -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-tv"></i> 2. Full Plate Graphic Breaking</span>
        <label style="cursor:pointer;"><input type="checkbox" id="plate-enable" onchange="sync()"> Show Plate</label>
      </div>
      <div class="form-group">
        <label>Plate Main Header / Title:</label>
        <input type="text" id="plate-title" value="ਵੱਡਾ ਖ਼ੁਲਾਸਾ: ਸੂਬਾ ਪੱਧਰੀ ਵਿਸ਼ੇਸ਼ ਰਿਪੋਰਟ" oninput="sync()">
      </div>
      <div class="form-group">
        <label>Bullet Points / Body Lines (1 per line):</label>
        <textarea id="plate-bullets" placeholder="Paste bullet points..." oninput="sync()">ਪਹਿਲਾ ਵੱਡਾ ਫ਼ੈਸਲਾ: ਤੁਰੰਤ ਪ੍ਰਭਾਵ ਨਾਲ ਨਵੀਆਂ ਹਦਾਇਤਾਂ ਲਾਗੂ
ਦੂਜਾ ਬਿੰਦੂ: ਸਰਹੱਦੀ ਖੇਤਰਾਂ ਵਿੱਚ ਵਿਸ਼ੇਸ਼ ਚੌਕਸੀ ਦੇ ਆਦੇਸ਼ ਜਾਰੀ
ਤੀਜਾ ਬਿੰਦੂ: ਲੋਕਾਂ ਦੀ ਸਹੂਲਤ ਲਈ 24 ਘੰਟੇ ਹੈਲਪਲਾਈਨ ਨੰਬਰ ਜਾਰੀ</textarea>
      </div>
      <div class="form-group">
        <label>Optional Side Image URL:</label>
        <input type="text" id="plate-img" value="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=800&q=80" oninput="sync()">
      </div>
    </div>

    <!-- 3. SIDE BREAKING PANEL -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-image"></i> 3. Side Breaking Box</span>
        <label style="cursor:pointer;"><input type="checkbox" id="side-enable" checked onchange="sync()"> Enable</label>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Position:</label>
          <select id="side-pos" onchange="sync()">
            <option value="left" selected>Left</option>
            <option value="right">Right</option>
          </select>
        </div>
        <div class="form-group">
          <label>Badge Tag:</label>
          <input type="text" id="side-tag" value="ਸਿੱਧੀਆਂ ਤਸਵੀਰਾਂ" oninput="sync()">
        </div>
      </div>
      <div class="form-group">
        <label>Font Size (19px - 72px):</label>
        <div class="slider-box">
          <input type="range" id="side-font" min="19" max="72" value="24" oninput="updateLbl('side-font-lbl', this.value); sync();">
          <span class="slider-val" id="side-font-lbl">24px</span>
        </div>
      </div>
      <div class="form-group">
        <label>Image URL:</label>
        <input type="text" id="side-img" value="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=600&q=80" oninput="sync()">
      </div>
    </div>

    <!-- 4. LOWER BREAKING BAND & LIVE BUG -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-rectangle-ad"></i> 4. Lower Band & Channel Bug</span>
        <label style="cursor:pointer;"><input type="checkbox" id="lower-enable" checked onchange="sync()"> Enable</label>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="form-group">
          <label>Lower Badge:</label>
          <input type="text" id="lower-badge" value="BREAKING NEWS" oninput="sync()">
        </div>
        <div class="form-group">
          <label>Channel Name:</label>
          <input type="text" id="bug-name" value="NEWS PUNJAB" oninput="sync()">
        </div>
      </div>
      <div class="form-group">
        <label>Headline Font Size (19px - 72px):</label>
        <div class="slider-box">
          <input type="range" id="lower-font" min="19" max="72" value="32" oninput="updateLbl('lower-font-lbl', this.value); sync();">
          <span class="slider-val" id="lower-font-lbl">32px</span>
        </div>
      </div>
      <div class="form-group">
        <label>UDT Rotation Speed (Seconds):</label>
        <input type="number" id="lower-speed" value="8" min="3" max="30" onchange="sync()">
      </div>
    </div>

  </div>

  <script src="controller.js"></script>
</body>
</html>
